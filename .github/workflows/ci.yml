name: commitgate-ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: commitgate-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: commitgate-ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        python: ["3.12", "3.8"]
    steps:
      - name: Check out the repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}

      - name: Record the interpreter under test
        id: interp
        run: |
          python -VV
          echo "version=$(python -c 'import sys; print("%d.%d.%d" % sys.version_info[:3])')" >> "$GITHUB_OUTPUT"

      - name: Install the test dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run the suite
        run: |
          python -m pytest tests/ -q
          python -m pytest tests/ --collect-only -q | tail -n 1

      - name: Check the exit-code contract
        run: |
          # Kept as a file in scripts/ rather than a heredoc: the assertions
          # have to be readable and reviewable on their own, and following the
          # same rule as the other checks means a contract that drifts turns
          # the job red instead of printing an unexpected number in green logs.
          python scripts/ci_check_exit_codes.py .

      - name: Check that a clean scan really reports what it read
        run: |
          python scripts/ci_check_report.py .

      - name: Check the published tree
        run: python scripts/ci_check_tree.py .

      - name: Write the job summary
        if: always()
        run: |
          {
            echo "### commitgate-ci (Python ${{ steps.interp.outputs.version }})"
            echo ""
            echo "- commit: \`${{ github.sha }}\`"
            echo "- interpreter: ${{ steps.interp.outputs.version }}"
            echo "- event: ${{ github.event_name }}"
          } >> "$GITHUB_STEP_SUMMARY"
